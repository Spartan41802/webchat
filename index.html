<body>
  <div class="chat-wrapper">

    <!-- SETTINGS PANEL -->
    <div id="settingsPanel" class="settings-panel">
      <h2>Profile Settings</h2>

      <label>Username</label>
      <input id="usernameInput" type="text" placeholder="Your name">

      <label>Profile Picture URL</label>
      <input id="avatarInput" type="text" placeholder="https://example.com/avatar.png">

      <button id="saveSettingsBtn">Save</button>
    </div>

    <!-- HEADER -->
    <div class="chat-header">
      <div class="chat-header-avatar" id="headerAvatar">?</div>
      <div class="chat-header-text">
        <span id="headerUsername">Your Chat</span>
        <span>Static chat with usernames + avatars</span>
      </div>
      <button id="openSettingsBtn" class="settings-btn">⚙️</button>
    </div>

    <!-- MESSAGES -->
    <div id="chatMessages" class="chat-messages"></div>

    <!-- INPUT -->
    <div class="chat-input-area">
      <input id="chatInput" type="text" placeholder="Type a message..." autocomplete="off" />
      <button id="sendBtn">Send ➤</button>
    </div>

    <div class="chat-footer">Static chat UI · GitHub Pages ready</div>
  </div>

  <style>
    .settings-btn {
      margin-left: auto;
      background: none;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }
    .settings-panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      background: #0f172a;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #334155;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 20;
    }
    .settings-panel input {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: white;
    }
    .settings-panel button {
      padding: 10px;
      border-radius: 6px;
      border: none;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      margin-right: 8px;
      object-fit: cover;
    }
    .message-row {
      display: flex;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .message-row.user {
      flex-direction: row-reverse;
    }
    .message-row.user .msg-avatar {
      margin-right: 0;
      margin-left: 8px;
    }
    .message-bubble {
      max-width: 70%;
      padding: 10px 12px;
      border-radius: 12px;
      background: #111827;
      border: 1px solid #1f2937;
      color: #e5e7eb;
    }
    .message-bubble.user {
      background: #1d4ed8;
      border: none;
    }
    .msg-name {
      font-size: 12px;
      opacity: 0.7;
      margin-bottom: 3px;
    }
  </style>

  <script>
    const messagesEl = document.getElementById("chatMessages");
    const inputEl = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");

    const settingsPanel = document.getElementById("settingsPanel");
    const openSettingsBtn = document.getElementById("openSettingsBtn");
    const saveSettingsBtn = document.getElementById("saveSettingsBtn");

    const usernameInput = document.getElementById("usernameInput");
    const avatarInput = document.getElementById("avatarInput");

    const headerUsername = document.getElementById("headerUsername");
    const headerAvatar = document.getElementById("headerAvatar");

    let profile = {
      username: "User",
      avatar: ""
    };

    let messages = [];

    function loadProfile() {
      const saved = localStorage.getItem("chat-profile");
      if (saved) profile = JSON.parse(saved);

      usernameInput.value = profile.username;
      avatarInput.value = profile.avatar;

      headerUsername.textContent = profile.username;
      headerAvatar.textContent = profile.avatar ? "" : profile.username[0]?.toUpperCase();
      if (profile.avatar) {
        headerAvatar.style.backgroundImage = `url(${profile.avatar})`;
        headerAvatar.style.backgroundSize = "cover";
      }
    }

    function saveProfile() {
      profile.username = usernameInput.value.trim() || "User";
      profile.avatar = avatarInput.value.trim();

      localStorage.setItem("chat-profile", JSON.stringify(profile));
      loadProfile();
      settingsPanel.style.display = "none";
    }

    function loadMessages() {
      const saved = localStorage.getItem("chat-messages");
      if (saved) messages = JSON.parse(saved);
      renderMessages();
    }

    function saveMessages() {
      localStorage.setItem("chat-messages", JSON.stringify(messages));
    }

    function addMessage(text, sender) {
      messages.push({
        text,
        sender,
        username: sender === "user" ? profile.username : "Bot",
        avatar: sender === "user" ? profile.avatar : "",
        time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
      });
      saveMessages();
      renderMessages();
    }

    function renderMessages() {
      messagesEl.innerHTML = "";

      messages.forEach(msg => {
        const row = document.createElement("div");
        row.className = "message-row " + msg.sender;

        const avatar = document.createElement("img");
        avatar.className = "msg-avatar";
        avatar.src = msg.avatar || "https://api.dicebear.com/7.x/shapes/svg?seed=bot";
        
        const bubble = document.createElement("div");
        bubble.className = "message-bubble " + msg.sender;
        bubble.innerHTML = `
          <div class="msg-name">${msg.username}</div>
          ${msg.text}
        `;

        row.appendChild(avatar);
        row.appendChild(bubble);
        messagesEl.appendChild(row);
      });

      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function fakeBotReply(text) {
      setTimeout(() => {
        addMessage("You said: " + text, "bot");
      }, 500);
    }

    function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      addMessage(text, "user");
      inputEl.value = "";
      fakeBotReply(text);
    }

    sendBtn.onclick = sendMessage;
    inputEl.onkeydown = e => {
      if (e.key === "Enter") sendMessage();
    };

    openSettingsBtn.onclick = () => {
      settingsPanel.style.display = "flex";
    };

    saveSettingsBtn.onclick = saveProfile;

    loadProfile();
    loadMessages();
  </script>
</body>
