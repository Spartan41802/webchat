<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Simple Chat</title>
<style>
  body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
  }

  .msg {
    display: flex;
    align-items: flex-start;
    margin-bottom: 12px;
  }

  .msg.me {
    flex-direction: row-reverse;
  }

  .msg img {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    margin: 0 8px;
    object-fit: cover;
  }

  .bubble {
    background: #222;
    padding: 8px 12px;
    border-radius: 10px;
    max-width: 70%;
  }

  .me .bubble {
    background: #2563eb;
  }

  #inputBar {
    display: flex;
    padding: 10px;
    background: #000;
    gap: 8px;
  }

  #inputBar input {
    flex: 1;
    padding: 10px;
    border-radius: 6px;
    border: none;
    background: #222;
    color: #eee;
  }

  #inputBar button {
    padding: 10px 16px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    cursor: pointer;
  }

  #profile {
    padding: 10px;
    background: #000;
    display: flex;
    gap: 8px;
  }

  #profile input {
    padding: 6px;
    border-radius: 6px;
    border: none;
    background: #222;
    color: #eee;
    flex: 1;
  }
</style>
</head>
<body>

<!-- SIMPLE PROFILE FIELDS -->
<div id="profile">
  <input id="username" placeholder="Username">
  <input id="avatar" placeholder="Avatar URL">
</div>

<!-- CHAT MESSAGES -->
<div id="messages"></div>

<!-- INPUT BAR -->
<div id="inputBar">
  <input id="text" placeholder="Type...">
  <button onclick="send()">Send</button>
</div>

<script>
  const messagesEl = document.getElementById("messages");
  const usernameEl = document.getElementById("username");
  const avatarEl = document.getElementById("avatar");
  const textEl = document.getElementById("text");

  function send() {
    const name = usernameEl.value.trim() || "User";
    const avatar = avatarEl.value.trim() || "https://api.dicebear.com/7.x/shapes/svg?seed=user";
    const text = textEl.value.trim();
    if (!text) return;

    addMessage(name, avatar, text, true);
    textEl.value = "";

    // simple bot echo
    setTimeout(() => {
      addMessage("Bot", "https://api.dicebear.com/7.x/shapes/svg?seed=bot", "You said: " + text, false);
    }, 400);
  }

  function addMessage(name, avatar, text, me) {
    const row = document.createElement("div");
    row.className = "msg" + (me ? " me" : "");

    const img = document.createElement("img");
    img.src = avatar;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = "<b>" + name + ":</b><br>" + text;

    row.appendChild(img);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  textEl.addEventListener("keydown", e => {
    if (e.key === "Enter") send();
  });
</script>

</body>
</html>
